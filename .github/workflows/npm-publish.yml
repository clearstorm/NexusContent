name: Node.js Package

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24 
          
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: "" # 👈 FIX: Prevents npm from trying to authenticate for regular downloads

      - run: npm test --if-present 

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
      
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          
      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: "" 
          
      - run: npm run build --if-present 
      
      - name: Publish (Dry Run)
        run: npm publish --provenance --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # npm consumes OIDC handshake here safely
