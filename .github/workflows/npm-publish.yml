name: Node.js Package

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Updated to the latest stable LTS
      - run: npm ci
      - run: npm test --if-present 

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # Updated to match the build job
          registry-url: https://npmjs.org
          
      - run: npm ci
      - run: npm run build --if-present 
      
      # Keeping the dry-run flag for your safety test
      - run: npm publish --provenance --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
