# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [published] # Changed from 'created' to avoid running on drafts

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    
    # ⚠️ CRITICAL: Added for Trusted Publishing (OIDC)
    permissions:
      id-token: write
      contents: read
      
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
          
      - run: npm ci
      
      # Optional: Runs your build script if you compile TypeScript/Babel
      - run: npm run build --if-present 
      
      # Uses modern OIDC and includes a verifiable provenance link
      - run: npm publish --provenance --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # npm reads the OIDC token here automatically
