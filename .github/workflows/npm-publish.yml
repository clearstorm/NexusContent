name: Node.js Package

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24 
          
      - name: Install dependencies
        run: npm ci

      - run: npm test --if-present 

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
      
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          
      - name: Install dependencies
        run: npm ci
          
      - run: npm run build --if-present 
      
      # FIX: We point to the registry and authenticate strictly on the publish command
      - name: Publish (Dry Run)
        run: npm publish --registry=https://npmjs.org --provenance --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
