name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project state
        run: npm run validate:project-state

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Test Astro SEO rendering
        run: npm run test:astro

      - name: Build Astro example (single locale)
        run: npm run build --workspace @nexuscontent/example-astro-basic

      - name: Build Astro example (localised)
        run: npm run build --workspace @nexuscontent/example-astro-basic-localised

      - name: Run plain Node compatibility example
        run: node examples/node-basic/index.mjs
